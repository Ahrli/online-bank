services:
  nginx:
    image: nginx:1.27-alpine
    container_name: online-bank-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx-online-bank.compose.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_network

networks:
  app_network:
    name: app_network
    external: true
